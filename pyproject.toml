[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmkit"
version = "0.2.0"
description = "Small client for an OpenAI-compatible LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[tool.setuptools]
packages = ["llmkit"]
